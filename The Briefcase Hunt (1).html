<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Briefcase Hunt</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a1d4a;--ink:#0d0818;--paper:#fff3d6;--pop:#ff5a4d;--gold:#ffc62e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#170f2b}}
:root[data-theme="dark"]{--bg:#170f2b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--paper);font-family:system-ui,sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:12px}
h1,h2,.hud b{font-family:Bangers,Impact,sans-serif;letter-spacing:1px;font-weight:400}
h1{font-size:48px;line-height:.95;margin:14px 0 8px;text-align:center;color:var(--gold);text-shadow:3px 3px 0 var(--pop)}
.sub{text-align:center;margin:0 0 14px;opacity:.9}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.row img{width:100%;border-radius:12px;border:3px solid var(--ink);display:block}
.big{display:block;width:100%;font:inherit;font-family:Bangers,Impact,sans-serif;font-size:28px;letter-spacing:1px;background:var(--pop);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.hud{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.hud b{font-size:30px;color:var(--gold)}
.stage{position:relative;aspect-ratio:1;border:4px solid var(--ink);border-radius:14px;overflow:hidden;background:linear-gradient(var(--a) 0 64%,var(--b) 64%)}
.stage:before{content:"";position:absolute;left:0;right:0;top:62%;height:5%;background:#0005}
.obj{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:4px;cursor:pointer;filter:drop-shadow(0 3px 0 #0007);line-height:1}
.obj:active{transform:translate(-50%,-50%) scale(.9)}
.obj.done{opacity:.4}
.obj.glow{opacity:1;font-size:80px!important;animation:pop .5s ease-out;filter:drop-shadow(0 0 18px var(--gold))}
.fom{position:absolute;width:22%;transform:translate(-50%,-50%);padding:0;border:3px solid var(--ink);border-radius:14px;overflow:hidden;cursor:pointer;background:none;animation:bob 2.4s ease-in-out infinite;animation-delay:var(--d)}
.fom img{width:100%;display:block}
@keyframes bob{50%{transform:translate(-50%,-54%)}}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.2)}}
@media (prefers-reduced-motion:reduce){.fom,.obj.glow,.case{animation:none}}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.say{display:flex;gap:10px;align-items:center;min-height:76px;margin:10px 0;padding:8px 12px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px}
.say img{width:52px;border-radius:10px;border:2px solid var(--ink)}
.say p{margin:0;font-size:15px}
.doors{display:flex;flex-wrap:wrap;gap:8px}
.door{flex:1;min-width:30%;font:inherit;font-weight:700;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:10px 6px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.door:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.win{position:fixed;inset:0;background:#0d0818f2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:5}
.win h2{font-size:42px;color:var(--gold);margin:8px 0;text-shadow:3px 3px 0 var(--pop)}
.win p{font-size:18px;max-width:340px}
.case{font-size:110px;animation:pop .6s ease-out;filter:drop-shadow(0 0 24px var(--gold))}
.win .big{max-width:320px}
.big{margin-top:10px}.alt{background:var(--gold);color:var(--ink);font-size:24px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:20px;padding:3px 10px;font-weight:700;font-size:14px}
.chip.red{background:var(--pop);color:#fff}
.fs{font-size:13px;color:var(--gold)}
.row2{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:10px;padding:12px 14px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;font:inherit;font-weight:700;text-align:left;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.row2 small{display:block;font-weight:500;opacity:.75}.row2[disabled]{opacity:.5;cursor:not-allowed}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.ach{padding:8px 0;border-bottom:1px solid #fff2}.lock{opacity:.5}
</style></head><body><div id="app"></div>

 app.innerHTML=`<h1>THE BRIEFCASE HUNT</h1><p class="sub">Sneak through 3 floors of the Department, dodge the guards and find the briefcase before time runs out.</p><div class="row">${imgs()}</div><button class="big" onclick="start(0)">PLAY · LEVEL ${S.lv}</button><button class="big alt" onclick="start(1)">${d?'DAILY DONE ✓ (REPLAY)':'DAILY CHALLENGE'}</button><div class="two"><button class="big alt" onclick="shop()">SHOP</button><button class="big alt" onclick="stats()">STATS</button></div><button class="big alt" onclick="S.snd^=1;sv();menu()">SOUND: ${S.snd?'ON':'OFF'}</button><p class="sub">🪙 ${S.coins}${S.streak?' · 🔥 '+S.streak+' day streak':''}</p>`}
function shop(){app.innerHTML=`<h1>SHOP</h1><p class="sub">🪙 ${S.coins}</p>`+Object.keys(UP).map(k=>{const u=UP[k],n=S.up[k],mx=n>=u[3],c=u[2]*(n+1);return `<button class="row2" ${mx||S.coins<c?'disabled':''} onclick="buy('${k}')"><span>${u[0]}<small>${u[1]} (${n}/${u[3]})</small></span><b>${mx?'MAX':c+' 🪙'}</b></button>`}).join('')+`<button class="big alt" onclick="menu()">BACK</button>`}
function buy(k){const u=UP[k],n=S.up[k],c=u[2]*(n+1);if(n>=u[3]||S.coins<c)return;S.coins-=c;S.up[k]++;sv();beep(660,.1);shop()}
function stats(){app.innerHTML=`<h1>STATS</h1><p class="sub">Level ${S.lv} · ${S.wins} wins · ${S.plays} runs<br>Fastest win: ${S.best?S.best+'s':'-'} · Coins: ${S.coins} · Streak: ${S.streak}</p>`+Object.keys(A).map(k=>`<div class="ach${S.ach[k]?'':' lock'}">${S.ach[k]?'🏆':'🔒'} <b>${A[k][0]}</b> – ${A[k][1]}</div>`).join('')+`<button class="big alt" onclick="menu()">BACK</button>`}
function start(dl){RG=dl?mul([...today()].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7)):Math.random;
 const lv=dl?6:S.lv,c=[];ks.forEach(k=>R[k].o.forEach((o,i)=>{if(o[4]!==0)c.push(k+i)}));
 const t=pick(c),key=pick(c.filter(x=>x!==t&&!/^(boss|vault)/.test(x))),card=pick(c.filter(x=>x!==t&&x!==key&&/^(mail|lab|roof)/.test(x))),tm=130+S.up.t*10,pk={};['time','shield','freeze'].forEach(ty=>{let x;do{x=pick(c)}while([t,key,card].includes(x)||pk[x]);pk[x]=ty});
 G={dl,lv,room:'lobby',t,tr:t.replace(/\d+$/,''),key,card,pk,vk:0,sh:0,fr:0,hk:0,seen:{},n:0,cl:{},lives:3+S.up.l,time:tm,tmax:tm,caught:0,g:[],w:null,gc:0,over:0};
 ks.forEach(clue);const gf=Object.keys(F),ng=1+(lv>2?1:0)+(lv>5?1:0);
 for(let i=0;i<ng;i++)G.g.push({f:gf[(i*2+rnd(2))%6],r:pick(GR),c:0,k:['p',lv>4?'r':'p',lv>7?'h':'p'][i]});
 RG=Math.random;S.plays++;sv();wander();show();
 say("Find the briefcase before time runs out. 3 floors: take the Lobby elevator to the Mail Room. Guards patrol: listen for footsteps. The Boss Office needs a key and the Vault needs a keycard. Some objects hide power-ups.");
 clearInterval(TM);TM=setInterval(tick,1000);beep(440,.1)}
function wander(){const o=Object.keys(F).filter(x=>x!==R[G.room].f);G.w=Math.random()<.5?pick(o):null}
function upd(){const e=document.getElementById('hud');if(!e)return;e.innerHTML=`<span class="chip${G.time<=15?' red':''}">⏱ ${G.time}s</span><span class="chip">${'❤️'.repeat(G.lives)||'💀'}</span><span class="chip">${G.hk?'🗝️':'🔒'} ${G.vk?'🪪':'▫️'}${G.sh?' 🛡️':''}${G.fr>0?' ❄️':''}</span><span class="chip">🪙 ${S.coins}</span>`}
function warn(){const e=document.getElementById('fs');if(!e)return;const a=G.g.find(g=>R[G.room].d.includes(g.r));e.textContent=a?'👣 Footsteps from the '+R[a.r].n+'...':''}
function show(){const r=R[G.room],fs=[[r.f,r.p]];if(G.w)fs.push([G.w,[r.p[0]>50?24:76,74]]);
 app.innerHTML=`<div class="bar" id="hud"></div><div class="hud"><b>${r.n} <small>F${r.fl}</small></b><span class="fs" id="fs"></span></div><div class="stage" style="--a:${r.a};--b:${r.b}">${r.o.map((o,i)=>`<button class="obj${G.seen[G.room+i]?' done':''}" id="o${i}" style="left:${o[1]}%;top:${o[2]}%;font-size:${o[3]}px" onclick="inv(${i})" aria-label="Investigate ${o[0]}">${o[0]}</button>`).join('')}${fs.map((f,j)=>`<button class="fom" style="left:${f[1][0]}%;top:${f[1][1]}%;--d:${j*.7}s" onclick="talk('${f[0]}')" aria-label="Talk to ${F[f[0]].n}"><img src="${F[f[0]].i}" alt="${F[f[0]].n}"></button>`).join('')}</div><div class="say" id="say"></div><div class="doors">${r.d.map(k=>`<button class="door" onclick="go('${k}')">${(k==='boss'&&!G.hk)||(k==='vault'&&!G.vk)?'🔒':'🚪'} ${R[k].n}</button>`).join('')}<button class="door" onclick="hint()">🔎 Hint 15🪙</button></div>`;upd();warn()}
function say(t,f){const e=document.getElementById('say');if(e)e.innerHTML=(f?`<img src="${F[f].i}" alt="">`:'')+`<p>${f?`<b>${F[f].n}:</b> `:''}${t}</p>`}
function tick(){if(!G||G.over)return;G.time--;if(G.time<=0){over('time');return}
 if(G.fr>0)G.fr--;else G.g.forEach(g=>{g.c++;const p=Math.max(3,7-Math.floor(G.lv/3))+S.up.s,per=g.k==='r'?Math.max(2,Math.ceil(p/2)):p;if(g.c>=per){g.c=0;const nb=R[g.r].d.filter(x=>GR.includes(x)),hn=g.k==='h'?nb.filter(x=>R[x].d.includes(G.room)||x===G.room):[];g.r=pick(hn.length?hn:nb)}});
 const g=G.g.find(x=>x.r===G.room);if(g){caught(g);return}warn();upd()}
function caught(g){if(G.sh){G.sh=0;const nb=R[g.r].d.filter(x=>GR.includes(x)&&x!==G.room);if(nb.length)g.r=pick(nb);upd();warn();say('🛡️ Your Shield blocked '+F[g.f].n+'! The shield is gone.',g.f);beep(500,.15);return}G.lives--;G.caught++;G.time=Math.max(1,G.time-10);beep(120,.4,'sawtooth');
 if(G.lives<=0){over('caught',g);return}
 G.room='lobby';g.r=pick(['archive','server','basement']);wander();show();
 say(`Guard ${F[g.f].n} spotted you! -1 life, -10s. Back to the Lobby.`,g.f);document.querySelector('.stage').classList.add('shake')}
function over(why,g){G.over=1;clearInterval(TM);const c=5+G.n;S.coins+=c;sv();beep(90,.6,'sawtooth');const t=why=='time';
 ov(`<div class="case">${t?'⏰':'🚨'}</div><h2>${t?'TIME UP!':'BUSTED!'}</h2><p>${t?'The Department closed for the night.':'Guard '+F[g.f].n+' escorted you out.'}</p><p>+${c} 🪙 for effort. The briefcase was in the ${R[G.tr].n}.</p><button class="big" onclick="rm();start(${G.dl?1:0})">TRY AGAIN</button><button class="big alt" onclick="menu()">MENU</button>`)}
function go(k){if(!G||G.over)return;
 if(k==='boss'&&!G.hk){say("🔒 The Boss Office is locked. Find the Boss Key first.");beep(200,.2);return}
 if(k==='vault'&&!G.vk){say('🔒 The Vault needs a Keycard. Search floors 2 and 3.');beep(200,.2);return}
 const g=G.g.find(x=>x.r===k);if(g){caught(g);return}
 G.room=k;wander();show();say("You walk into the "+R[k].n+".");beep(330,.05)}
function clue(k){if(G.cl[k])return G.cl[k];let t;
 if(k===G.tr)t=pick(["Weirdly warm in here. Something was hidden nearby.","Fresh scratch marks on the floor. Keep digging in this room."]);
 else{const tg=RG()<.65?G.tr:pick(ks.filter(x=>x!==G.tr&&x!==k));
  t=pick(["A coffee-stained note: 'Try the #.'","Graffiti: 'THE CASE IS IN THE #'. Someone added 'maybe'.","Muddy footprints lead toward the #."]).replace('#',R[tg].n)}
 return G.cl[k]=t}
function hint(){if(!G||G.over)return;if(S.coins<15){say("Not enough coins for the radar.");return}
 S.coins-=15;sv();upd();beep(700,.1);say("🔎 Radar: the signal is strongest in the "+R[G.tr].n+".")}
function inv(i){if(!G||G.over)return;const o=R[G.room].o[i],id=G.room+i;
 if(G.seen[id]){say("Already checked the "+o[0]+". Nothing new.");return}
 G.seen[id]=1;G.n++;beep(520,.05);
 if(id===G.t){found(i);return}
 document.getElementById('o'+i).classList.add('done');
 if(id===G.key){G.hk=1;show();say("🗝️ You found the BOSS KEY hidden inside the "+o[0]+"! The Boss Office is open.");beep(900,.2);return}
 if(id===G.card){G.vk=1;show();say('🪪 You found the VAULT KEYCARD inside the '+o[0]+'! The Vault is open.');beep(900,.2);return}
 const p=G.pk[id];if(p){PK[p][1]();show();say(PK[p][0]);beep(800,.15);return}
 say(o[4]===0?clue(G.room):o[4])}
function talk(f){if(!G||G.over)return;const r=Math.random();let t;
 if(r<.3){const tg=Math.random()<.5?G.tr:pick(ks.filter(x=>x!==G.tr));t=pick(["I heard rattling near the #.","Psst. Try the #. Or don't.","Definitely not the #. Definitely."]).replace('#',R[tg].n)}
 else t=pick(Math.random()<.5?F[f].l:GEN);
 if(t===last)t=pick(GEN);last=t;say(t,f)}
function found(i){G.over=1;clearInterval(TM);const b=document.getElementById('o'+i);b.textContent='💼';b.className='obj glow';beep(880,.15);
 const used=G.tmax-G.time,co=20+G.time+G.lv*5+(G.dl?30:0),nw=[],gv=k=>{if(!S.ach[k]){S.ach[k]=1;nw.push(A[k][0])}};
 S.coins+=co;S.wins++;if(!S.best||used<S.best)S.best=used;
 if(G.dl){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.last===y?S.streak+1:(S.last===today()?S.streak:1);S.last=today();gv('day')}else if(S.lv<99)S.lv++;
 gv('first');if(R[G.tr].fl===3)gv('top');if(used<40)gv('fast');if(!G.caught)gv('ghost');if(S.coins>=200)gv('rich');if(S.lv>=5)gv('lv5');sv();
 SH=`I found the briefcase in ${used}s on ${G.dl?'the Daily Challenge':'Level '+G.lv} in The Briefcase Hunt! 💼 Can you beat me?`;
 const dl=G.dl;setTimeout(()=>{beep(1175,.3);ov(`<div class="case">💼</div><h2>YOU FOUND THE BRIEFCASE.</h2><p>${pick(W)}</p><p style="opacity:.8;font-size:14px">${used}s · +${co} 🪙${nw.length?'<br>🏆 '+nw.join(' · 🏆 '):''}</p><button class="big" onclick="rm();${dl?'menu()':'start(0)'}">${dl?'MENU':'NEXT LEVEL'}</button><button class="big alt" onclick="share()">SHARE SCORE</button><button class="big alt" onclick="menu()">MENU</button>`)},1000)}
function share(){if(navigator.share)navigator.share({title:'The Briefcase Hunt',text:SH,url:location.href}).catch(()=>{});else try{navigator.clipboard.writeText(SH+' '+location.href);alert('Score copied!')}catch(e){alert(SH)}}
menu();
</script></body></html>
